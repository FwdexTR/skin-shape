<!doctype html>
<!-- Modelo da imagem de compartilhamento (1200×630). Para refazer: abrir este
     arquivo no Chrome com janela de 1200×630, capturar a tela e salvar como
     src/app/opengraph-image.jpg em JPEG ~80 (abaixo de 300 KB por causa do WhatsApp). -->
<html lang="pt-BR"><head><meta charset="utf-8"><style>
@font-face{font-family:Bricolage;src:url(Bricolage-600.ttf)}
@font-face{font-family:Kaushan;src:url(KaushanScript.ttf)}
@font-face{font-family:Manrope;src:url(Manrope-500.ttf)}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#f7f4ee;display:flex;font-family:Manrope;color:#181a19;overflow:hidden}
.texto{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:56px 40px 56px 72px}
.logo{height:150px;width:auto;align-self:flex-start}
h1{font-family:Bricolage;font-weight:600;font-size:74px;line-height:.98;letter-spacing:-2.5px}
h1 span{font-family:Kaushan;font-weight:400;color:#1d4b4e;letter-spacing:0}
p{font-size:24px;color:#3d4340;margin-top:22px}
.foto{width:430px;padding:26px 26px 26px 0;position:relative}
.foto img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;border-radius:130px 32px 32px 32px}
</style></head><body>
<div class="texto">
  <img class="logo" src="../../../public/images/skin-shape/marca/logo.svg" alt="">
  <div><h1>Comer bem ficou mais <span>perto.</span></h1>
  <p>Empório funcional, café e bistrô · Centro de Campos dos Goytacazes</p></div>
</div>
<div class="foto"><img src="foto.jpg" alt=""></div>
</body></html>
